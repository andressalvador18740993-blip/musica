<!-- Barra de Reproducción Mejorada y Más Grande -->
<div id="audio-player-bar" class="hidden fixed bottom-0 left-0 right-0 bg-zinc-950 border-t border-zinc-800 p-4 shadow-2xl z-50">
    <div class="max-w-md mx-auto flex flex-col gap-3">
        
        <!-- Info de la Canción -->
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="w-12 h-12 bg-zinc-800 rounded-xl overflow-hidden flex-shrink-0 flex items-center justify-center text-zinc-400">
                    <i class="fa-solid fa-music text-lg"></i>
                </div>
                <div class="truncate">
                    <h4 id="player-title" class="text-sm font-bold text-zinc-100 truncate">Título</h4>
                    <p id="player-artist" class="text-xs text-zinc-400 truncate">Artista</p>
                </div>
            </div>
            <!-- Botón de Letra / Karaoke -->
            <button onclick="openLyrics()" class="text-zinc-400 hover:text-emerald-400 p-2 transition">
                <i class="fa-solid fa-microphone-lines text-lg"></i>
            </button>
        </div>

        <!-- Controles de Reproducción Grandes -->
        <div class="flex items-center justify-around py-1">
            <!-- Botón Aleatorio (Toggle) -->
            <button id="shuffle-btn" onclick="toggleShuffle()" class="text-zinc-400 hover:text-emerald-400 p-3 text-lg transition" title="Modo Aleatorio">
                <i class="fa-solid fa-shuffle"></i>
            </button>

            <!-- Anterior -->
            <button onclick="prevSong()" class="text-zinc-200 hover:text-emerald-400 p-3 text-xl transition">
                <i class="fa-solid fa-backward-step"></i>
            </button>

            <!-- Play / Pause Grande -->
            <button id="play-pause-btn" onclick="togglePlay()" class="w-14 h-14 bg-emerald-500 hover:bg-emerald-400 text-zinc-950 rounded-full flex items-center justify-center text-xl shadow-lg transition">
                <i class="fa-solid fa-play ml-0.5"></i>
            </button>

            <!-- Siguiente -->
            <button onclick="nextSong()" class="text-zinc-200 hover:text-emerald-400 p-3 text-xl transition">
                <i class="fa-solid fa-forward-step"></i>
            </button>

            <!-- Repetir / Espacio simétrico -->
            <div class="w-8"></div>
        </div>

    </div>
</div>

<audio id="main-audio-element" onended="nextSong()"></audio>
